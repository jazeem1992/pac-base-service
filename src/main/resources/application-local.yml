# =====================================================================================
#  LOCAL profile - developer machine (default profile)
#  Requires a local PostgreSQL and Redis. Consul and AWS are disabled; downstream services are
#  resolved through the static "simple" discovery client below.
#  Override any value with environment variables, e.g. DB_PASSWORD=... ./mvnw spring-boot:run
# =====================================================================================

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pac_base}?ApplicationName=${spring.application.name}
    username: ${DB_USERNAME:pac}
    password: ${DB_PASSWORD:pac}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      leak-detection-threshold: 20000
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      ssl:
        enabled: false
  cloud:
    consul:
      enabled: false
      config:
        enabled: false
      discovery:
        enabled: false
    discovery:
      client:
        simple:
          instances:
            credit-score-service:
              - uri: ${CREDIT_SCORE_SERVICE_URL:http://localhost:8081}

logging:
  level:
    com.allianz.pac: DEBUG
    org.hibernate.SQL: DEBUG

app:
  logging:
    method-log-level: INFO
    log-arguments: true

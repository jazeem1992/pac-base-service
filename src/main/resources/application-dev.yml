# =====================================================================================
#  DEV profile - shared development environment on AWS
#  Required environment variables:
#    DB_PROXY_ENDPOINT, DB_NAME, DB_SECRET_NAME, REDIS_HOST, CONSUL_HOST, AWS_REGION
# =====================================================================================

spring:
  config:
    import:
      # Shared configuration from Consul KV (optional: the service starts without KV entries)
      - "optional:consul:"
      # RDS credentials (keys "username"/"password") exposed as db.username / db.password
      - "aws-secretsmanager:${DB_SECRET_NAME}?prefix=db."
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      leak-detection-threshold: 30000

logging:
  level:
    com.allianz.pac: DEBUG

app:
  logging:
    method-log-level: INFO
    log-arguments: true
  cache:
    default-ttl: 5m
